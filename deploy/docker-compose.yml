# Run from the repo root on the VM:
#   cp deploy/.env.example deploy/.env   # then edit
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: vu-handbook-mcp

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: vu-handbook-mcp:local
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_BIND: 0.0.0.0
      MCP_PORT: "8000"
      MCP_TRUSTED_PROXIES: "*"     # only Caddy can reach this container (no published ports)
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
